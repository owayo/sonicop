# このリポジトリのツールチェーン。ローカルと CI の両方がここを正とする。

[tools]
# profile と components を明示する。未指定だと rustup の既定の profile 次第で入るものが変わり、
# GitHub Actions のランナー (minimal) では cargo fmt が無いと言われて落ちる
rust = { version = "1.99.1", profile = "minimal", components = ["rustfmt", "clippy"] }
# gem のラッパーとテスト (rake test:ruby)、gem の組み立て (rake gem / gem:platform) に使う
# RubyInstaller に 4.0.8 がまだないため、Windows は配布済みの 4.0.7 で検査する。
ruby = [
  { version = "4.0.8", os = ["linux", "macos"] },
  { version = "4.0.7", os = ["windows"] },
]
