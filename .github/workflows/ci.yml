# sonicop の CI。検査の中身は Makefile の ci が決め、ここには OS ごとの準備だけを置く。
#
# - quality: Linux で make setup と make ci を実行する (fmt-check・clippy・版の一致・Rust と Ruby のテスト・
#   source gem の導入と実行)
# - native: RubyGems の platform gem を作るのと同じ macOS / Windows のランナーでテストする
# - build: release.yml の build と同じ組で platform gem を作る。release.yml の dry_run では build が走らないので、
#   配布物を作れることはここで確かめる
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    # macOS と Windows のテストは native が platform gem と同じランナーで回す
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ツールの版は mise.toml が正 (rust と ruby)。mise 本体は公開から 14 日以上たった最新の版を、署名付きの
      # checksum で確かめて入れる。cache は切る (効いた回だけ clippy / rustfmt が欠ける。jdx/mise-action#215)
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      # target/ と ~/.cargo のキャッシュ (鍵に rustc の版が入るので、mise.toml の rust を上げると作り直す)
      - uses: Swatinem/rust-cache@v2

      - run: make setup
      - run: make ci

      # make ci の gem-check が作った source gem
      - uses: actions/upload-artifact@v7
        with:
          name: source-gem
          path: sonicop-*.gem

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # RubyGems の platform gem (arm64-darwin / x86_64-darwin / x64-mingw-ucrt) を作る release.yml の build と同じランナーでテストするため版を固定する (上げるときは release.yml と下の build も同時に上げる)
        os: [macos-15, windows-2025]
    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する。release.yml の build と同じく LF のまま取る
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      - uses: Swatinem/rust-cache@v2

      # Windows のランナーの make は MinGW の mingw32-make の写しで、レシピの POSIX シェル前提の解釈に癖があるので、
      # make を通さず cargo と rake を直接呼ぶ。
      # `--no-fail-fast` は上の matrix の `fail-fast: false` とは別のもの。matrix 側は OS の
      # ジョブどうしが互いを打ち切らないという意味で、cargo 側は test binary どうしが互いを
      # 打ち切らないという意味。片方だけだと、Windows で lib の 1 件が落ちた時点で
      # tests/cops.rs が走らず、「失敗 1 件」が「少なくとも 1 件」の意味になる。
      - name: Test
        run: cargo test --all-targets --locked --no-fail-fast

      # tests/cli.rs は gem ラッパーを ruby で起動する。find_binary のパス解決は OS 差が出るところなので、
      # Windows / macOS でも回す
      - name: Test the Ruby wrapper
        run: rake test:ruby

  build:
    name: Build (${{ matrix.platform }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # release.yml の build と同じ組 (行を足したら両方に足す)
        include:
          # x86_64-linux: バイナリはビルドしたランナーの glibc 以上を要求するので、ubuntu-latest の更新で要求が黙って上がらないよう版を固定する
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/sonicop
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/sonicop
            platform: aarch64-linux
          # x86_64-darwin: Apple Silicon のランナーでクロスコンパイルする。Intel のランナーには mise の
          # ビルド済みの Ruby が無く、Ruby をソースから作るだけで 10 分以上かかる
          - os: macos-15
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/sonicop
            platform: x86_64-darwin
          # arm64-darwin: native がテストしているのと同じランナーで作る
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/sonicop
            platform: arm64-darwin
          # x64-mingw-ucrt: native がテストしているのと同じランナーで作る
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/sonicop.exe
            platform: x64-mingw-ucrt
    steps:
      # Windows のランナーは既定で LF を CRLF に変えて checkout する。release.yml の build と同じく LF のまま取り、
      # gem に入れるファイルの改行を配布物とそろえる
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # mise.toml の ruby は Linux と macOS ではビルド済みのもの、Windows では RubyInstaller から入る
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      # mise.toml の rust はホストのツールチェーンと components だけを入れるので、配布のターゲットを足す
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # クロスコンパイルした Intel 向けのバイナリが x86_64 だけを含み、Rosetta の上で動くことを確かめる
      # (tree-sitter の C のコードもターゲット向けにコンパイルされているか)。最低の macOS の版も記録に出す
      - name: Check the Intel macOS binary
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          test "$(lipo -archs "$BINARY")" = x86_64
          otool -l "$BINARY" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX'
          arch -x86_64 "$BINARY" --version

      # package_gem は出来上がった gem の platform と libexec の中身を事後に確かめるので、
      # ソース gem に落ちた場合はここで失敗する
      - name: Build the platform gem
        run: rake gem:platform BINARY=${{ matrix.binary }} GEM_PLATFORM=${{ matrix.platform }}
