[package]
name = "sonicop"
version = "26.8.101"
edition = "2024"
rust-version = "1.85"
description = "A fast, native RuboCop-compatible Ruby linter and formatter"
license = "MIT"
repository = "https://github.com/owayo/sonicop"
readme = "README.md"
keywords = ["ruby", "rubocop", "linter", "formatter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sonicop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "wrap_help"] }
encoding_rs = "0.8.35"
globset = "0.4.19"
ignore = "0.4.31"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
shell-words = "1.1.1"
tempfile = "3.27.0"
tree-sitter = "0.26.11"
tree-sitter-ruby = { git = "https://github.com/owayo/tree-sitter-ruby.git", rev = "3f2ee5055ec710da6866e006474a61f9bbc31cfd" }
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }

[dev-dependencies]
assert_cmd = "2.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
