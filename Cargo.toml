[package]
name = "sonicop"
version = "26.10.100"
edition = "2024"
rust-version = "1.98"
description = "A fast, native RuboCop-compatible Ruby linter and formatter"
license = "MIT"
repository = "https://github.com/owayo/sonicop"
readme = "README.md"
keywords = ["ruby", "rubocop", "linter", "formatter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sonicop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
encoding_rs = "0.8.42"
fs2 = "0.4.3"
globset = "0.4.20"
ignore = "0.4.33"
rayon = "1.12.0"
regex = "1.13.1"
# RuboCop 1.89.0 が利用する rubydex 0.4.1 と同じ索引・パーサを固定する。
rubydex = { git = "https://github.com/Shopify/rubydex.git", rev = "43926a2999b8693d1fa1d7b8bead58cb1b0a3f6f" }
# 固定した rubydex は Prism 1.9 を使う。2.x は同じ links 名の native library と競合する。
ruby-prism = "=1.9.0"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
shell-words = "1.1.1"
sonicop-prism-compat = { path = "crates/sonicop-prism-compat" }
sonicop-onigmo-compat = { path = "crates/sonicop-onigmo-compat" }
tempfile = "3.27.0"
# 0.27.1 の percent literal の回復は文法 v26.10.103 と組で検証する (owayo/tree-sitter-ruby#6)。
tree-sitter = "=0.27.1"
tree-sitter-ruby = { git = "https://github.com/owayo/tree-sitter-ruby.git", tag = "v26.10.103" }
ureq = { version = "3.5.0", default-features = false, features = ["native-tls"] }
unsafe-libyaml = "0.2.11"

[dev-dependencies]
assert_cmd = "2.2.2"

[build-dependencies]
blake3 = "1.8.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
xattr = "1.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = { version = "0.13.0", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

# `cargo build --profile profiling` はサンプリングプロファイラ用のシンボルを残しつつ、
# `--release` と同じ最適化コードを生成する。
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
