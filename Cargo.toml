[package]
name = "sonicop"
version = "26.8.112"
edition = "2024"
rust-version = "1.85"
description = "A fast, native RuboCop-compatible Ruby linter and formatter"
license = "MIT"
repository = "https://github.com/owayo/sonicop"
readme = "README.md"
keywords = ["ruby", "rubocop", "linter", "formatter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sonicop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
encoding_rs = "0.8.35"
fs2 = "0.4.3"
globset = "0.4.20"
ignore = "0.4.33"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
shell-words = "1.1.1"
tempfile = "3.27.0"
tree-sitter = "0.26.12"
tree-sitter-ruby = { git = "https://github.com/owayo/tree-sitter-ruby.git", tag = "v26.8.103" }
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }

[dev-dependencies]
assert_cmd = "2.2.2"

[build-dependencies]
blake3 = "1.8.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `cargo build --profile profiling` はサンプリングプロファイラ用のシンボルを残しつつ、
# `--release` と同じ最適化コードを生成する。
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
