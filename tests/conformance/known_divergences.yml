# 本家 RuboCop 1.89.0 との既知差分。
#
# tests/conformance.rs のケースを常に実行し、出た差分をここと突き合わせる。
#   - 登録が無い差分が出た   → 新しい退行なので失敗する
#   - 登録があるのに出ない   → 直ったので失敗する (このファイルから消すこと)
#
# 期待値は本家の実出力から取る。sonicop の出力を写すとバグを仕様として
# 焼き付けるため、`scratchpad/ab_cops.py` で突合してから登録する。
#
# エントリを手で書き起こす必要はない。テストが失敗すると追記用の YAML を
# 提示するので、note を埋めてから取り込む。自動では書き換えない (差分は
# バグの記録なので、増えるときは人間が中身を見るべきだから)。
#
#
# ■ 「移植版が独自に足した番人が、本家との一致を壊している」ときの分け方
#
# sonicop には本家に無い番人が 2 つある。どちらも「本家と同じ訂正」を止めることがあり、
# 症状は同じに見える。**直す先は逆なので、登録する前に必ず分ける。**
#
#   verified_by_reparse   訂正後を再パースして木が変わらないか見る (4 cop)
#                         止まると offense ごと消える → 「検出漏れ」に見える
#   構文の安全網          訂正後が有効な Ruby か見る (全体)
#                         止まると訂正だけ消える → 「訂正されない」に見える
#
# 分かれ目は 1 つだけで、`ruby -c` 1 回で決まる:
#
#   本家の出力が有効な Ruby   → ★ 番人が間違っている。番人を直す。ここに登録しない
#   本家の出力が無効な Ruby   → ★ 番人が正しい。本家に合わせると壊れる。ここに登録する
#
# ■ 「本家に合わせない」の 2 種類目 — 出力は valid だが意味が変わる
#
# 上の分け方は「訂正後が Ruby として通るか」で決まる。**通るのに合わせられない形が
# もう 1 種類ある。** 番人は構文しか見ないので、この種類は番人を素通りする。
#
#   本家の出力が ★ 無効な Ruby        → 安全網が止める。忠実に写しても disk には届かない → 寄せる
#   本家の出力が ★ valid だが意味が違う → 安全網は通す。忠実に写すと黙って壊れる     → ★ 寄せない
#
# **2 つは対処が逆なので、同じ節にまとめない。** 前者は「本家に合わせたうえで番人が守る」、
# 後者は「本家に合わせないことそのものが判断」である。後者を前者と同じ枠に入れると、
# 次に読む人が「安全網があるから大丈夫」と読んでしまう。安全網はこの種類を守らない。
#
# 実例 (どちらも 2026-08-17):
#
#   Style/RedundantParentheses の heredoc 配列
#     本家の出力は有効な Ruby だった。tree-sitter が heredoc を開き手と本体の 2 ノードで
#     綴るのに対し本家のパーサは 1 ノードなので、木の比べ方のほうが誤っていた。
#     → normalized() を直した。登録しない。
#
#   Layout/BlockEndNewline の heredoc で終わるブロック
#     本家の出力が `ruby -c` を通らない (expected a block beginning with `{` to end with `}`)。
#     → 安全網が正しい。ここに登録する。
#
# **症状だけで決めないこと。** どちらも「本家と一致する訂正が出てこない」に見えるが、
# 前者は移植版のバグ、後者は本家のバグである。`ruby -c` を打つまでは分からない。

# 検証コーパスが見ていないもの。CONFORMANCE.md に必ず出す。
#
# 現在の検証コーパスは 5 本、計 18,251 ファイル:
#   rubocop/rubocop 1,765 (f009b33) / rails/rails 3,551 (62b5458) / ruby/ruby 7,466 (3349f41) /
#   Homebrew/brew 2,179 (38ee325) / mastodon/mastodon 3,290 (fad3685)
# 括弧内は測定に使ったコーパスの commit。CONFORMANCE.md の表と同じものを指す。
# 既定設定では TargetRubyVersion がコーパスごとに 2.7 / 3.3 / 4.0 に解決されるので、
# 版依存の挙動はこの 3 つの範囲では踏めている。
# 死守ライン (`fullfmt.sh` の `-A` バイト比較) で、意図して割れているファイル。
#
# **除外しない。差分そのものを期待値として監視する。** 両者の出力のハッシュを固定して
# あるので、**同じファイルが別の理由で変わったら気づける**。除外にすると、そこが
# どう変わっても静かになる。
#
# 読み方: `既知 4 / 新規 0` なら通過。`新規` が 1 でもあれば退行。
# ハッシュが動いた既知は「同じファイルが別の理由で割れた」なので、これも止める。
#
# **数字だけを報告しない。**「4 件割れている」と読まれる。必ず「既知 4 / 新規 0」と書く。
