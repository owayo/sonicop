# 本家 RuboCop 1.89.0 との既知差分。
#
# tests/conformance.rs のケースを常に実行し、出た差分をここと突き合わせる。
#   - 登録が無い差分が出た   → 新しい退行なので失敗する
#   - 登録があるのに出ない   → 直ったので失敗する (このファイルから消すこと)
#
# 期待値は本家の実出力から取る。sonicop の出力を写すとバグを仕様として
# 焼き付けるため、`scratchpad/ab_cops.py` で突合してから登録する。
#
# エントリを手で書き起こす必要はない。テストが失敗すると追記用の YAML を
# 提示するので、note を埋めてから取り込む。自動では書き換えない (差分は
# バグの記録なので、増えるときは人間が中身を見るべきだから)。

# 検証コーパスが見ていないもの。CONFORMANCE.md に必ず出す。
#
# 現在の検証コーパスは 5 本、計 18,242 ファイル:
#   rubocop/rubocop 1,763 / rails/rails 3,550 / ruby/ruby 7,465 /
#   Homebrew/brew 2,175 / mastodon/mastodon 3,289
# 既定設定では TargetRubyVersion がコーパスごとに 2.7 / 3.3 / 4.0 に解決されるので、
# 版依存の挙動はこの 3 つの範囲では踏めている。
blind_spots:
  - corpus: 全コーパス
    not_covered: 既定以外の設定値 (EnforcedStyle の非既定値・CountAsOne・Max の変更など)
    consequence: 設定分岐は tests/cops.rs の手書きケースでしか通らず、実プロジェクトの .rubocop.yml で差分が出得る
  - corpus: 全コーパス
    not_covered: 拡張プラグイン (rubocop-rails / rubocop-performance など) を入れた状態
    consequence: プラグイン cop との相互作用や、プラグインが変える既定値の影響を測れていない
  - corpus: 全コーパス
    not_covered: Windows の改行と EnforcedStyle native
    consequence: Layout/EndOfLine の crlf 側の分岐は手書きケースでしか通らない
  - corpus: 全コーパス
    not_covered: UTF-16 など、マジックコメントで宣言されない非 UTF-8 の符号化
    consequence: 復号できず構文エラー扱いになる。本家も同じ結論になるかはケース次第
  - corpus: tests/conformance.rs の手書きケース
    not_covered: 大規模な実コード / cop 同士の相互作用 / autocorrect の反復収束
    consequence: 単体では一致しても、実プロジェクトで組み合わせ由来の差分が残り得る

# autocorrect のバイト一致は 4 コーパスすべてで確認済み
# (rubocop/rubocop は -a と -A、rails/rails・Homebrew/brew・mastodon/mastodon は -A)。
#
# 意図的に本家と違えている箇所が 1 つだけある。本家の autocorrect は
# lib/rubocop/runner.rb の File.write で終わるため、`# encoding: cp932` を宣言した
# Shift_JIS のファイルを直すと UTF-8 のバイト列で上書きし、マジックコメントだけが
# cp932 のまま残る。実測すると本家の出力は cp932 として読み直せず、ファイルが壊れる。
# sonicop は宣言された符号化へ再符号化して書き戻す (src/engine.rs の output_bytes)。
# 表現できない文字が出る場合は書き戻さず失敗させ、元のファイルに触れない。
#
# 「本家のバグは再現しない」と判断した根拠: ai-second-opinion (gpt-5.6-sol) の判定。
#   ドロップイン互換はバグ互換の対象に境界があり、ファイル内容と encoding 宣言を
#   不整合にする挙動まで製品保証に含めるべきではない。非 UTF-8 ソースは 18,242 ファイル中
#   8 件と稀だが、稀なファイルほど置換困難な資産である可能性がある。
# 本家へ upstream パッチを送るべき問題でもある。

divergences:
  # --- Lint/Syntax ---
  # 本家は parser gem (LALR) の誤り回復に乗って追加の診断を出す。tree-sitter は
  # ファイルを正しく解析してしまうので、回復後の状態から生まれる診断は再現できない。
  # 実コーパスでは `class definition in method body` / `dynamic constant assignment` /
  # 1 つの多行ハッシュ内で繰り返される `unexpected token` がこれに当たる。
  - cop: Lint/Syntax
    case: lint_syntax_recovery_cascade
    kind: false_negative
    upstream: |-
      1:1-6 (5 chars) class definition in method body
      (Using Ruby 2.7 parser; configure using `TargetRubyVersion` parameter, under `AllCops`)
    sonicop: (検出なし)
    note: endless メソッドの誤りが parser の def 文脈を開いたままにするため、本家は class の還元でこれを出す。回復後の状態は tree-sitter からは再現できない
  # 本家は解析前にソースを UTF-8 へ再符号化し、補間の無い正規表現リテラルを
  # `Regexp.new` に通す (parser gem `Builders::Default#static_regexp`)。診断の文面は
  # Ruby の正規表現エンジン (Onigmo) の例外そのままなので、再現するには Onigmo の
  # 検証とその文面を移植することになる。ここだけ通しても他の RegexpError
  # (unmatched close parenthesis / invalid quantifier など) は出せないままで、
  # コーパスが踏んだ 1 種類だけを実装するのは件数合わせにしかならない。
  - cop: Lint/Syntax
    case: lint_syntax_static_regexp_validation
    kind: false_negative
    upstream: |-
      1:1-7 (6 chars) too short escaped multibyte character: /\xdf/
      (Using Ruby 2.7 parser; configure using `TargetRubyVersion` parameter, under `AllCops`)
    sonicop: (検出なし)
    note: 本家は正規表現リテラルを Ruby の Regexp.new に通し、Onigmo の例外文面をそのまま診断にする。移植には Onigmo の検証とメッセージ生成が要る (実コーパスでは ruby/ruby の test/ruby/enc/test_windows_1252.rb だけが踏む)
