# whitequark の架空 capture 宣言は、有効な Ruby 2.7 の呼び出しまで空白補正で壊す。
# AST の cop dispatch は本家に合わせるが、束縛には本家と実 Ruby がともに宣言する名前だけを使う。
# tests/regexp_semantics.rs が元の実出力との不一致と、Prism の物理束縛での実出力との一致を両方検査する。
regexp_binding_divergences:
  - case: empty
    targets: [2.7/default, 3.2/parser_whitequark]
    reference: 3.3/default
    reason: >-
      空の補間は Ruby 2.7 の new_evstr が EVSTR に残すため、名前付き capture を宣言しない。
      whitequark は空 begin を空文字列へ連結して架空の変数を宣言する。本家の空白補正後は、
      実 Ruby 2.7.8 でも y(+1) が y() + 1 へ変わり、引数不足の ArgumentError になる。
  - case: leading_empty
    targets: [2.7/default, 3.2/parser_whitequark]
    reference: 3.3/default
    reason: >-
      先行する空文は Ruby 2.7 の NODE_BEGIN を残し、単一の文字列と同じには畳み込まれない。
      whitequark の架空 capture による呼び出しの再解釈を防ぐ。末尾だけの区切りと空文字列は除外しない。
  - case: leading_empty_paren
    targets: [2.7/default, 3.2/parser_whitequark]
    reference: 3.3/default
    reason: 同上。括弧の中に先行する空文がある場合も、空文を削って静的宣言に変えてはいけない。
  - case: discarded_capture
    targets: [2.7/default, 3.2/parser_whitequark]
    reference: 3.3/default
    reason: >-
      whitequark は複文の全 str を連結するが、Ruby 2.7 は値を使わない先行 str を捨てる。
      捨てた str にしかない capture 名を新たに宣言すると、後続のメソッド呼び出しを誤って変数として補正する。
      実 Ruby 側にしかある捕捉名を追加する方針ではなく、両方が宣言する名前の積集合に限定する。
  - case: middle_empty_paren
    targets: [2.7/default, 3.2/parser_whitequark]
    reference: 3.3/default
    reason: >-
      Ruby 2.7 の block_append は、先行 str を捨てた後に現れる空括弧も NODE_BEGIN として残す。
      その後に str があっても NODE_BLOCK は静的文字列へ戻らず、new_evstr が EVSTR に保つ。
      本家の架空 capture に従う空白補正は、実 Ruby 2.7.8 でも有効な y(+1) を ArgumentError に変える。
      中間のセミコロンだけの空文は別の構造なので、正当な宣言を除外しない。
  - case: first_empty_paren
    targets: [2.7/default, 3.2/parser_whitequark]
    reference: 3.3/default
    reason: 同上。先頭の空括弧を、後続の str だけを選ぶ簡略化で失ってはいけない。
