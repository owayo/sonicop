  # 書き戻し時の補助 Prism 検査と polyglot 起動用 prefix の保護。
  - cop: Style/Semicolon
    case: syntax_guard_legacy_multiple_safe
    kind: correction
    upstream: "until parent, base = File.split(path)\n parent == path or parent == \".\"\n  puts base\nend\n"
    sonicop: "until (parent, base = File.split(path); parent == path or parent == \".\")\n  puts base\nend\n"
    note: >-
      Style/Semicolon が条件内の区切りを改行へ変えた後、Style/ParenthesesAroundCondition が必要な括弧を除く。裸の複数代入を until 条件へ残し Ruby が拒否する。
      TargetRubyVersion 2.7 の本家 1.89.0 の実出力と Ruby 4.0.7 の ruby -c で確認した。
      2026-10-15 の ai-second-opinion / Claude は、ドロップイン互換でも有効な原本を
      実行不能にする書き込みは再現せず、ファイル単位で拒否することを支持した。
      診断用のパーサ選択は変えず、補正の最後だけ対象版（Prism の下限は 3.3）で比較する。
      同じ設定で原本が有効な場合だけ拒否し、原本と未補正の診断、stderr の理由、終了 2 を返す。
      構文が有効なまま意味だけが変わる一般の補正は、この保護の対象には含めない。
