# Windows の File.write による未解析 tail の変更と、その保存から生じる差だけ。
# 通常の純 LF コード・private/method 削除の互換修正を包括的に除外しない。
windows_native_tail_divergences:
  - cop: Layout/SpaceAroundOperators
    case: windows_native_lf_autocorrection_preserves_data_tail
    kind: correction
    platform: windows
    ending: lf
    target_engines: ["2.7/parser_whitequark", "3.4/parser_prism"]
    modes: [-a, -A]
    source: "x=1\np DATA.binmode.read.bytes\n__END__\na\nb\n"
    upstream: "x = 1\r\np DATA.binmode.read.bytes\r\n__END__\r\na\r\nb\r\n"
    sonicop: "x = 1\r\np DATA.binmode.read.bytes\r\n__END__\r\na\nb\n"
    note: >-
      本家1.89.0のWindows File.writeは、純LF原本の補正でDATAへもCRを挿入し、
      DATA.binmode.read.bytesを[97,10,98,10]から[97,13,10,98,13,10]へ変える。
      通常コードとmarker行は本家と同じCRLFにし、未解析DATAの元byteだけを守る。
      2026-10-25の同providerによる独立実装レビューが支持した。Claudeの判定ではない。
      tests/fixtures/windows_corrections.jsonへ生の本家bytes・全JSON・実行値・再実行を保存し、
      tests/windows_corrections.rsが原本・本家・安全出力とこのentryを照合する。
      CRLF/mixed/bare CR、空・未終端DATA、偽markerは同fixtureの陰性対照で監視する。
  - cop: Layout/SpaceAroundOperators
    case: windows_native_lf_autocorrection_preserves_code_nul_tail
    kind: correction
    platform: windows
    ending: lf
    target_engines: ["2.7/parser_whitequark", "3.4/parser_prism"]
    modes: [-a, -A]
    source: "x=1\np x\n\0ignored\nnext\n"
    upstream: "x = 1\r\np x\r\n\0ignored\r\nnext\r\n"
    sonicop: "x = 1\r\np x\r\n\0ignored\nnext\n"
    note: >-
      DATA保存と同じ独立判断を、Rubyがコードとして読むNULから後の未解析bytesにも適用する。
      通常コードのWindows改行は本家へ揃え、NUL以降の元LFをCRLFへ変えない。
      copが明示した末尾空白等の本文補正は維持し、このentryはWindowsの暗黙CR挿入だけを防ぐ。
      literal/comment中のNULをEOFとはせず、同fixtureの本家全診断・実bytes・再実行で区別する。
  - cop: Lint/UselessAccessModifier,Layout/EmptyLines
    case: windows_preserved_data_tail_keeps_raw_empty_lines_guard_visible
    kind: correction
    platform: windows
    ending: lf
    target_engines: ["2.7/parser_whitequark"]
    modes: [-A]
    source: "class A\n  foo\n\n  private\n\n  bar\nend\n__END__\na\n\n\nb\n"
    upstream: "class A\r\n  foo\r\n\r\n\r\n  bar\r\nend\r\n__END__\r\na\r\n\r\n\r\nb\r\n"
    sonicop: "class A\r\n  foo\r\n\r\n  bar\r\nend\r\n__END__\r\na\n\n\nb\n"
    note: >-
      保存するDATAの3LFはEmptyLinesのraw_source全体のquick guardを有効にする。
      架空の全CRLF viewでtailを隠さず、安全な保存予定bytesをrawとして読むため、
      private除去で露出したコードの余分な空行を初回から取り除く。本家より追加の
      corrected EmptyLines診断が1件生じ、初回2診断から実ディスク再入力の二度目0診断、
      bytes不変となる。初回原本のrawは仮想化しない。
      同providerの独立レビューが、実行可能な1/2の本文とDATA.binmodeでもこの帰結を確認した。
      原本DATA値を候補は保ち、本家はCR挿入で変える。通常のprivate削除だけの差はこの例外に含めない。

divergences:
  - cop: Style/StringConcatenation
    case: style_string_concatenation_meta_hex_safety
    kind: correction
    upstream: "name = 'x'\nputs((\"\\x81#{name}\").b.unpack1('H*'))\n"
    sonicop: "name = 'x'\nputs((\"\\xE1#{name}\").b.unpack1('H*'))\n"
    note: >-
      data-corruption-prevention。本家 1.89.0 の StringConcatenation は
      adjust_str の part.value.inspect を補正へ書き出す。Ruby 2.7 用の Whitequark lexer は
      meta + hexadecimal のエスケープを誤読し、原本の実行結果 e178 を -A 後に 8178 に変える。
      構文は有効なまま値を壊すため、診断を維持しつつ Ruby 実行時の 0xE1 を保存する。
      2026-10-08 の ai-second-opinion / Claude Opus は、該当コード・最小再現・両者の実行結果と
      ドロップイン互換の目的を確認し、値を保つ補正を採用するよう判定した。
      差分は unsafe autocorrect のみに限定する。lint / -a は本家と一致し、
      通常の hexadecimal と meta エスケープ、Prism を使う Ruby 3.3 は陰性対照として検査する。
  - cop: Lint/UselessAssignment
    case: lint_useless_assignment_implicit_array_safe
    kind: correction
    upstream: "foo, '\\n'\n"
    sonicop: "result = foo, '\\n'\n"
    note: >-
      本家 1.89.0 の remove_local_variable_assignment_part は、単一変数へ代入する
      括弧なしの配列 RHS からも変数名と = を消す。原本は ruby -c に通るが、
      -a 後は裸のカンマ式になって構文エラーを起こし、本家自身も Lint/Syntax を報告する。
      2026-10-08 の ai-second-opinion / Claude Opus は、ドロップイン互換を踏まえても
      有効なファイルを壊す明白なバグと判定し、診断を保ちながら修正を適用しない案を支持した。
      構文安全網が原本と初期診断を維持し、stderr に拒否を示す。fail-level によらず終了 2
      とし、後続ファイルを検査する。明示的な配列では本家と同じ修正をする対照も検査する。
  - cop: Lint/UselessAssignment
    case: lint_useless_assignment_implicit_array_unsafe
    kind: correction
    upstream: "foo, '\\n'\n"
    sonicop: "result = foo, '\\n'\n"
    note: >-
      同じ構文破壊は -A でも再現する。2026-10-08 に本家の実出力と ruby -c の失敗を
      確認し、別プロバイダーの Claude Opus の判定に従って書き戻しを拒む。
      fail-level によらず終了 2 と stderr の拒否メッセージを検査し、原本と初期診断を保持する。
  - cop: Layout/SpaceAroundOperators
    case: crlf_autocorrect_preserves_line_endings
    kind: correction
    upstream: "x = 1\n"
    sonicop: "x = 1\r\n"
    note: >-
      本家は補正時に CRLF を LF へ変えて書き戻す。`__END__` 後に `a\r\nb\r\n` を置き
      `DATA.read.bytes` を測ると、本家の -a 後は CR が消え、実行時の値まで変わる。
      移植版は変更範囲外のバイトを守るため CRLF を保つ。別プロバイダーの判定でも、
      本家の I/O の副作用によるデータ変更として、意図的乖離を支持した。
  - cop: Layout/SpaceAroundOperators
    case: nul_truncated_tokens_limit_the_line_ending_inspection
    kind: correction
    source: "a=1\0ignored\ntrailing\r\n"
    upstream: "a = 1\0ignored\ntrailing\n"
    sonicop: "a = 1\0ignored\ntrailing\r\n"
    note: >-
      既存のCRLF保持方針を、コードNULの後ろにあるmixed改行の未変更行でも保つ。
      本家1.89.0の-a/-AはSourceBufferの正規化で無関係なCRを消すが、Sonicopは
      原本のNULと後続本文を保持し、補正対象外のCRLFを変更しない。3組の対象Ruby/
      ParserEngineで診断全項目・終了値と本家の生出力を記録し、CLIで原本の行と照合する。
      Windowsの補正後raw_sourceは保存予定bytesへ揃えるため、その保護の帰結となる
      EndOfLineの範囲は同じ物理bytesを本家へ再入力した診断とも別に照合する。
  - cop: Style/FrozenStringLiteralComment
    case: mixed_crlf_reinspection_preserves_copied_endings
    kind: correction
    source: "STDOUT.write(DATA.read.unpack1(\"H*\"))\r\n__END__\nalpha\r\nbeta\n"
    upstream: "# frozen_string_literal: true\nSTDOUT.write(DATA.read.unpack1(\"H*\"))\n__END__\nalpha\nbeta\n"
    sonicop: "# frozen_string_literal: true\nSTDOUT.write(DATA.read.unpack1(\"H*\"))\r\n__END__\nalpha\r\nbeta\n"
    note: >-
      既存CRLF保持方針をmixedの未変更copy区間にも適用する。本家1.89.0の-Aは
      DATA内のCRLFもLFへ変えてDATA.readの実値を変えるため、元pairの由来を各passへ
      移して最終書出しだけ復元する。解析viewはLFを保つ。Windowsでは補正後raw_sourceを
      安全な保存予定bytesへ揃え、EndOfLineの診断差も同じ物理bytesの本家再入力で監視する。
      mixedの挿入LFと元のLF・単独CRは一律にCRLFへしない。物理出力を再入力した場合は
      EndOfLineが再びCRを報告し得るため、その実診断も本家へ同じ保存予定bytesを与えて
      別に測定する。この再実行差を本家と原本からの完全一致へ数えない。
      10入力×白2.7/Prism3.4×検査/-a/-Aの60条件と再実行に加え、連続CRを含むDATAの
      6入力×同2engine×同3modeの36条件で2copが別passで前置する補正を測定する。
      解析で隠したCRと可視の元単独CRを別に追跡し、後者が次passで隠れる場合も元byteを
      復元する。同じLFの複数CR・片側編集・元CRと新規LFの接続はunitで監視する。
      元からCRLFのみの連続CRで既存方針も元単独CRを失う差は、この修正の成功へ数えない。
  - cop: Style/FrozenStringLiteralComment
    case: crlf_autocorrect_preserves_original_bare_cr
    kind: correction
    source: "STDOUT.write(DATA.read.unpack1(\"H*\"))\r\n__END__\r\nx\r\r\ny\r\n"
    upstream: "# frozen_string_literal: true\nSTDOUT.write(DATA.read.unpack1(\"H*\"))\n__END__\nx\r\ny\n"
    sonicop: "# frozen_string_literal: true\r\nSTDOUT.write(DATA.read.unpack1(\"H*\"))\r\n__END__\r\nx\r\r\ny\r\n"
    note: >-
      全CRLFの既存保持方針は、元pairのCRだけでなくDATA内の元単独CRも守る。
      本家1.89.0は補正後にLFを書き戻してDATA.readを変えるため、このbyte差は意図的に保つ。
      全CRLFは各LFへdefault CRを付け、元pairを追加markerへ二重計数しない。
      可視の元単独CRだけを追跡し、次passや書出し前の正規化で隠れる場合も追加の元CRとして
      復元する。置換・挿入の同じCRへ由来を推測しない。1/2cop、2engine、検査/-a/-Aの
      192条件と再実行で診断全項目・終了値・生bytesを比較し、DATA値を原本と照合する。
  - cop: Style/CaseLikeIf
    case: style_case_like_if_nested_else_safety
    kind: correction
    upstream: |
      case x
      when 1
        a
      when 2
        b
      else
        when 3
          c
        end
      end
    sonicop: |
      if x == 1
        a
      elsif x == 2
        b
      else
        if x == 3
          c
        end
      end
    note: >-
      本家 1.89.0 は else 内の if も when に変え、Ruby 4.0.6 が SyntaxError とする
      ファイルを -A で上書きする。文法側もこの構文を ERROR なしで受け取るため、
      診断は一致させつつ補正だけ見送って元ファイルを保護する。別プロバイダーの
      レビューでも、本家の出力が構文エラーであること、診断の互換性を保てることから、
      独自の修正を加えず補正だけ見送る判断を支持した。-A の `corrected` も本家の
      true に対して false となるが、`correctable` は一致させる。
  - cop: Style/CaseLikeIf
    case: style_case_like_if_nested_unless_safety
    kind: correction
    upstream: |
      case x
      when 1
        a
      when 2
        b
      else
        when 3
          c
        end
      end
    sonicop: |
      if x == 1
        a
      elsif x == 2
        b
      else
        unless x == 3
          c
        end
      end
    note: >-
      本家 1.89.0 は else 内の unless も if と同様に when へ置換し、
      Ruby 4.0.6 が SyntaxError とするファイルを書き出す。検出と correctable は
      一致させ、補正だけ見送る。上の if のケースと同じ安全上の判断を適用する。
  - cop: Style/CaseLikeIf
    case: style_case_like_if_nested_if_modifier_safety
    kind: correction
    upstream: |
      case x
      when 1
        a
      when 2
        b
      else
        c when 3
      end
    sonicop: |
      if x == 1
        a
      elsif x == 2
        b
      else
        c if x == 3
      end
    note: >-
      本家 1.89.0 は else 内の修飾子付き if を `c when 3` に変え、構文エラーの
      ファイルを上書きする。診断を一致させ、補正だけ見送る。
  - cop: Style/CaseLikeIf
    case: style_case_like_if_nested_unless_modifier_safety
    kind: correction
    upstream: |
      case x
      when 1
        a
      when 2
        b
      else
        c when 3
      end
    sonicop: |
      if x == 1
        a
      elsif x == 2
        b
      else
        c unless x == 3
      end
    note: >-
      本家 1.89.0 は else 内の修飾子付き unless も `c when 3` に変え、構文エラーの
      ファイルを上書きする。診断を一致させ、補正だけ見送る。
  # --- Style/EmptyLiteral ---
  # ★ 「本家に合わせない」の 2 種類目 (出力は valid だが意味が変わる)。冒頭の節を参照。
  #
  # 本家 `style/empty_literal.rb:100`:
  #
  #     def first_argument_unparenthesized?(node)
  #       parent = node.parent
  #       return false unless parent && %i[send super zsuper].include?(parent.type)
  #
  # `%i[send super zsuper]` に `csend` が無いので、`recv&.foo Hash.new` では偽になり、
  # 本家は括弧を付けずに置き換える。実測 (2026-08-17、本家 1.89.0 の `-A`):
  #
  #     recv.foo  Hash.new   本家 → recv.foo({})    移植 → recv.foo({})    一致
  #     recv&.foo Hash.new   本家 → recv&.foo {}    移植 → recv&.foo({})   ★差
  #
  # **`recv&.foo {}` は構文としては通るが、意味が変わる。** 呼び出しの後ろの `{}` は
  # 空ハッシュではなくブロックとして解釈される。`#41` の安全網は「valid か」しか見ないので
  # この形を止めない。**利用者は黙って別の動作をするコードを受け取る。**
  #
  # 本家のバグと判断した根拠は、本家自身が `.` では正しく `&.` でだけ間違えること。
  # 設計上の選択なら両方が同じ形になるはずで、そうなっていない。
  #
  # 2026-09-27 に ai-second-opinion / Claude で再判定した。本家コード自身が「ブロックと
  # 引数のハッシュは違う」と明記し、同じ欠陥を super では既に直している点を確認した。
  # 引数が 2 つなら本家の -a は構文エラーのファイルを書き出すことも実測した。
  - cop: Style/EmptyLiteral
    case: style_empty_literal_safe_navigation_argument
    kind: correction
    # `|-` ではなく `|`。`Kind::Correction` の差分は**訂正後のソース全体**なので末尾の改行まで
    # 含み、`judge()` は文字列を完全一致で突き合わせる。`|-` は末尾の改行を削るため一致しない。
    upstream: |
      recv&.foo {}
    sonicop: |
      recv&.foo({})
    note: >-
      本家は `%i[send super zsuper]` に csend を書いていないため、`&.` の呼び出しでだけ
      括弧を付けずに置き換える。出力は valid な Ruby だが `{}` がブロックとして解釈され、
      意味が変わる。本家自身が `.` では括弧を付けるので見落としと判断し、寄せない。
      2026-09-27 の ai-second-opinion / Claude も、本家自身の意図と
      2 引数での構文破壊を根拠に、安全のためこの乖離を維持すると判定した。
  - cop: Style/EmptyLiteral
    case: style_empty_literal_safe_navigation_two_arguments
    kind: correction
    upstream: |
      recv&.foo {}, 1
