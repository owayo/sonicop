blind_spots:
  # --- CRLF 改行 (2026-08-18) ---
  # 2026-08-18 時点、既存 5 コーパスに CRLF を含む `.rb` は 0 ファイルで、手書きテストと
  # 本家 spec にも無かった。3 つの検査が同じ形を欠き、CRLF の欠陥を測れていなかった。
  # 現在は `tests/cli.rs` と `src/diagnostic.rs` に CRLF の範囲・メッセージの回帰がある。
  #
  # 埋め方は「コーパスを増やす」ではなく **`scripts/crlf_probe.sh` で既存の入力に形を作る**。
  # これで見つかって直したもの (計 249 件):
  #   Layout/LineLength              `\r` を桁数に数え、120 桁の行が超過に見えた。
  #                                 `-A` が `{ }` を `do end` に書き換えた
  #   Layout/SpaceAroundOperators    35 件。行末の演算子が「右に空白なし」に見えた
  #   Lint/LiteralInInterpolation    24 件。heredoc 行末の `#{' '}` が行末と判定されない
  #   Layout/EmptyLinesAround*      222 件。空行を空行と認識しない
  #   Style/CommentAnnotation         3 件。`# FIXME\r` が「キーワード + 何か」に見えた
  # 直しは `support::chomp` に 20 箇所を寄せた。個別に書くと必ずどこかが漏れる。
  # 2026-09-27 には複数行 offense の `length`、`Layout/EndOfLine` の終端位置、
  # `Lint/Debugger` のメッセージでも CRLF 正規化の差を見つけ、最小例で固定した。
  #
  # --- ★ Style/RedundantParentheses は本家側の取りこぼし (合わせない) ---
  # CRLF では本家がこの cop を報告しない。移植版は報告する (rails を CRLF 化して 119 件)。
  # 本家はこの cop だけ `ReparsedEquivalence#verified_by_reparse` を通し、訂正後を再パースして
  # AST が等価か確かめる。CRLF ではその判定が通らない。
  #
  # ★ 本家自身の正規化 (`normalize_reparsed_ast` = 子が 1 つの begin を畳む) を通した等価判定は
  # **LF `true` / CRLF `true`** — 訂正は意味を変えない。実挙動でも括弧の有無で結果は変わらない。
  # **報告して訂正するのが正しいので、本家に合わせて黙らせてはいけない。**
  #
  # ★ 判別子の注意: `Ripper.sexp` の比較は使えない。**Ripper は括弧を構文木に残す**ので LF 版でも
  # 非等価になり「意味が変わった」と誤読する。本家と同じ parser gem + 上の正規化で比べること。
  #
  # (mixin を include する他の 5 cop は `verified_by_reparse` を実際には呼んでいないので、
  #  この形は 1 cop だけに出る。「同じ mixin だから同じ挙動」と読まないこと。)
  #
  # --- 共有構文エラーファイル内で回復後に分岐する Lint/Syntax (#57・2026-08-18) ---
  # **両者が同じく構文エラーと呼ぶファイルの中では、回復後に分岐する診断を追わない。**
  # 線はここに 1 本だけ引く。下の 2 つは同じ族なので、同じ扱いにする。
  #
  #   1. 実コーパスの残差
  #      Homebrew/brew@38ee325 の 2,179 ファイルで Lint/Syntax が missing 924 / excess 330
  #      (2026-10-08、更新後バイナリで再測定)。
  #      **Lint/Syntax 以外は missing 0 / excess 0** (約 5 万 offense、multiset で照合)。
  #      Lint/Syntax を持つファイルの集合は 569 対 569 で完全一致し、食い違うのは
  #      共有ファイル内の診断位置だけで、Sonicop-only のファイルは 0。
  #      569 が構文エラーになるのは、Ruby 4.0 のコードベース (Library/Homebrew/.ruby-version
  #      = 4.0.6) を既定の 2.7 で測っているため。3.1 で測ると両者 0 件になる。
  #
  #   2. 版のゲート (case/in と 式のピン `^(expr)`)
  #      本家は節キーワードを全部報告したあと、入れ子に応じた位置の余剰な `end` を出す。
  #      top-level なら case 自身、`def` の中なら def の `end`、2 重の入れ子ならいちばん外側。
  #      さらに `def` の中の `else` は `else without rescue is useless` になり、
  #      「予期しないトークン」ですらない。**規則ではなくパーサの状態機械そのもの**なので
  #      モデル化しない。1 件目だけを出す (tests/cops.rs の syntax mod を参照)。
  #      `v [0] += foo(when)` の後続診断の差は 2026-10-08 に解消した。
  #      コマンドへの代入で打ち切る本家の分岐に合わせ、未宣言名・定数・引数なし呼び出しを
  #      cop テストとファイル書き戻しの CLI テストで監視する。他の回復位置の差は残る。
  #
  # **1 件目を出すことに意味がある**のは、それでファイルが構文エラーになり
  # **他の cop が 1 つも走らなくなる**からである。失われていた最大のものはそれで、
  # 診断の件数ではない。
  - corpus: Homebrew/brew ほか、構文エラーを含む全コーパス
    not_covered: 両者が構文エラーと呼ぶファイルの中で、回復後に分岐する Lint/Syntax の位置
    consequence: 件数と位置が食い違う (Homebrew で missing 924 / excess 330)。構文エラーファイル集合と「そのファイルを検査しない」ことは一致する
    note: >-
      2 つのパーサ (whitequark/parser と tree-sitter) が同じ壊れた入力から違う回復をする。
      追うには本家のパーサの状態機械を再実装することになる。**Lint/Syntax 以外の
      過剰検出・見落としは 0 件**なので、cop の適合性そのものには影響しない。移植版を
      1 ファイル 1 診断へ抑えると一部の過剰診断は消えるが、一致している診断も失う。
      その一律の抑制は修正として扱わない。
  - corpus: 全コーパス
    not_covered: 既定以外の設定値 (EnforcedStyle の非既定値・CountAsOne・Max の変更など)
    consequence: 設定分岐は tests/cops.rs の手書きケースでしか通らず、実プロジェクトの .rubocop.yml で差分が出得る
    note: >-
      2026-08-16 に本家の spec 由来の「単純な let(:cop_config) 1 つ」のケース 343 件を
      一度だけ通し、そこで見つかった実バグを修正した (Lint/SafeNavigationConsistency など)。
      **一度掃いただけで、継続的なテストにはなっていない。** ケースは commit していないので、
      次に設定分岐を壊しても CI は落ちない。「測った」と「守られている」は別である。
  - corpus: 全コーパス
    not_covered: 拡張プラグイン (rubocop-rails / rubocop-performance など) を入れた状態
    consequence: プラグイン cop との相互作用や、プラグインが変える既定値の影響を測れていない
  - corpus: 全コーパス
    not_covered: Windows の改行と EnforcedStyle native
    consequence: Layout/EndOfLine の crlf 側の分岐は手書きケースでしか通らない
  - corpus: 全コーパス
    not_covered: UTF-16 など、マジックコメントで宣言されない非 UTF-8 の符号化
    consequence: 復号できず構文エラー扱いになる。本家も同じ結論になるかはケース次第
  - corpus: tests/conformance.rs の手書きケース
    not_covered: 大規模な実コード / cop 同士の相互作用 / autocorrect の反復収束
    consequence: 単体では一致しても、実プロジェクトで組み合わせ由来の差分が残り得る
  - corpus: tests/formatter.rs
    not_covered: markdown フォーマッタ × ファイル全体に対する offense
    consequence: 本家が落ちるので固定値を取れない (下の「フォーマッタの既知差分」を参照)
  - corpus: tests/formatter.rs
    not_covered: clang 系 (clang / progress / fuubar / pacman / tap) のキャレット幅、マルチバイト文字を含む行
    consequence: 幅の算出自体は src/display_width_table.rs で本家と一致済み (下の「フォーマッタの既知差分」2 を参照)。固定値との突き合わせが無いので、描画側の回帰は検出できない
  - corpus: tests/formatter.rs
    not_covered: 複数ファイルの列挙順そのもの
    consequence: 対象の並び順が本家と違うため、順序を持つ全フォーマッタで行の並びが入れ替わる

# フォーマッタの既知差分 (2026-08-12 時点)。いずれも src/formatter.rs 側の
# 描画ではなく、外側か本家のバグに原因がある。
#
# 1. markdown × ファイル全体に対する offense — 本家が落ちる。
#    MarkdownFormatter#write_code は `offense.location.source_line` を取る前に
#    possible_ellipses(location) を呼ぶが、`add_global_offense` の offense が持つ
#    Offense::PseudoSourceRange は single_line? を定義していない
#    (lib/rubocop/cop/offense.rb:63-84)。結果として
#    `undefined method 'single_line?' for an instance of
#    RuboCop::Cop::Offense::PseudoSourceRange` で異常終了し (exit 2)、
#    途中まで書いた markdown だけが残る。同じ run に登録した他フォーマッタは
#    finished を呼ばれず、出力が空か要約抜きで切れる。
#    html が無事なのは assets/output.html.erb:87 の
#    `unless offense.location.source_line.strip.empty?` が先に弾くため。
#    sonicop は落とさず完全な markdown を出す。クラッシュは再現しない。
#
# 2. clang 系のキャレット幅 — 一致済み。ClangStyleFormatter#report_highlighted_area
#    (clang_style_formatter.rb:47-55) は `'^' * Unicode::DisplayWidth.of(source_area)`、
#    字下げも `' ' * Unicode::DisplayWidth.of(...)` で、いずれも**表示幅**で数える。
#    sonicop も src/display_width.rs で同じ表示幅を使う。表は gem から生成した
#    src/display_width_table.rs で、全 111 万コードポイントで
#    unicode-display_width 3.2.0 と一致することを確認済み
#    (`ruby scripts/dump_display_width.rb` で再生成)。
#
#    残る差分要因は 2 つ。
#    (a) gem の版。本家の gemspec は `>= 2.4.0, < 4.0` を許すので、利用者の
#        rubocop が別の版で数えると数コードポイントで食い違い得る。表は 3.2.0 に固定。
#    (b) 書記素クラスタ。sonicop は 1 文字ずつ足すが、gem は絵文字 ZWJ 連結などを
#        クラスタ単位で扱う場合がある。ASCII を挟んだ差分検証では全コードポイントで
#        加算が一致したが、連結列そのものは突き合わせていない。
#
#    以前はハンドメイドの表を持っており、結合文字 U+3099 / U+309A が Wide の
#    一括レンジ 0x3041..=0x33FF に飲まれて 2 桁と数えられていた。macOS が渡す
#    NFD 分解された日本語 (`x = "がが"`) でキャレットが 6 本でなく
#    10 本になる不具合があり、表を生成方式に置き換えて解消した。
#
# 3. 対象ファイルの列挙順 — 未一致。原因は src/formatter.rs ではなく対象探索。
#    ディレクトリ指定: 本家はパス文字列のバイト順なので `type.rb` → `type/helpers.rb`。
#    sonicop は PathBuf の成分順で比較するため `type/helpers.rb` → `type.rb` になる。
#    ファイル直接指定: 本家は引数の順を保つが、sonicop は並べ替える。
#    html / offenses / worst は自前で並べ直すので影響を受けない。
#
# 4. json の metadata — 意図的。ruby_engine / ruby_version / ruby_platform は
#    sonicop 自身の値を出し、sonicop_version を足す。files と summary は一致する。

# 設定読み込みの既知差分 (2026-08-21 時点)。いずれも「本家が例外で止まるところを
# sonicop は止めない」型で、上のフォーマッタ 1 と同じ方針に立つ。**本家のクラッシュは
# 再現しない。** リンタが利用者の設定ミスでバックトレースを吐いて終わるのは、
# 一致させる価値のある挙動ではないため。
#
# 1. スカラで書かれた Include / Exclude — 本家が落ちる。
#    `Exclude: "tmp/**/*"` のようにリスト記法を忘れると、本家は
#    `Config#make_excludes_absolute` の `String#map!` で
#    `undefined method 'map!' for an instance of String` を上げて終了する
#    (lib/rubocop/config.rb:117)。sonicop は Ruby の `Array(...)` と同じく
#    単独スカラを 1 要素として読む。**黙って捨てないことが要点**で、
#    以前は `.ok()?` が握り潰しており、利用者の Exclude が丸ごと無効なまま
#    実行が成功したように見えていた。設定ミスを検出する側に倒すなら
#    エラーにする選択肢もあるが、その場合も無言で捨てるのだけは不可。
#
# 2. 非 UTF-8 の .ruby-version / Gemfile.lock — 本家が落ちる。
#    `TargetRuby` は候補ファイルを `File.read` して
#    `invalid byte sequence in UTF-8` で終了する (target_ruby.rb:181)。
#    sonicop は読めない候補を諦めて次の供給源に落ちる。
#    **.gemspec だけは本家も同じく諦める** (`GemspecFile#version_from_gemspec_file`
#    が nil を返す) ので、そちらは差分ではなく一致。
#    3 つを揃えているのは、候補探索が cwd から `/` まで祖先を遡るため、
#    検査対象と無関係なファイル 1 つで実行全体が止まるのを避けるため。

# autocorrect のバイト一致は 4 コーパスすべてで確認済み
# (rubocop/rubocop は -a と -A、rails/rails・Homebrew/brew・mastodon/mastodon は -A)。
#
# 符号化の書き戻しは本家と意図的に異なる。本家の autocorrect は
# lib/rubocop/runner.rb の File.write で終わるため、`# encoding: cp932` を宣言した
# Shift_JIS のファイルを直すと UTF-8 のバイト列で上書きし、マジックコメントだけが
# cp932 のまま残る。実測すると本家の出力は cp932 として読み直せず、ファイルが壊れる。
# sonicop は有効な宣言が補正後も残る場合、元の符号化を保つ。
# Style/FrozenStringLiteralComment が宣言を無効な位置へ動かす場合は、本家の有効な UTF-8
# に合わせる。通常の補正で元の非 UTF-8 バイトを変える必要がある場合は、全補正を拒否する。
# encoding_rs と Ruby の表が異なるため、実際に適用された編集の元範囲から文字の由来を追う。
# 新しい非 ASCII が最終出力に残るときは推測で符号化しない。別範囲の削除では相殺できない。
# 途中で追加されてから削除された文字や、衝突で捨てた編集は拒否の根拠にしない。
# 表現できない文字が出る場合は書き戻さず失敗させ、元のファイルに触れない。
#
# ただし**再符号化するのは、その宣言が読むときに実際に要ったファイルだけ**である。
# decoded_source は有効な宣言を先に適用する。補正前に宣言がコメントとして無効だった
# ファイルは UTF-8 として読まれているので、そのまま UTF-8 で書き戻す。補正後の宣言で変換すると
# cop が触っていないバイトが変わるうえ、Ruby は宣言を信じて読むので**文字列の中身が変わる**。
# rails の activerecord/test/migrations/magic/1_currencies_have_symbols.rb が実例で、
# `# coding: ISO-8859-15` と書きながら UTF-8 の `€` (e2 82 ac) を持つ。本家はこの 3 バイトを
# そのまま書き戻すが、以前の sonicop は `\xa4` の 1 バイトへ潰していた (3 文字が 1 文字になる)。
#
# **このファイルは、読むときには宣言が効いていない。** 原本は 1 行目が
# `# frozen_string_literal: true` で `# coding:` は 2 行目にあり、
# `Parser::Source::Buffer.recognize_encoding` は 1 行目 (shebang なら 2 行目) しか見ないので、
# 本家も sonicop も UTF-8 として読む。ところが `-A` の途中で Lint/OrderedMagicComments が
# 順序を入れ替えて `# coding:` を 1 行目へ動かすため、**書き戻しの時点で初めて宣言が有効になる**。
# 「読みと書きが非対称」だけでは再現できない。**cop が宣言の位置を動かすのが引き金**である。
#
# 「本家のバグは再現しない」と判断した根拠: ai-second-opinion (gpt-5.6-sol) の判定。
#   ドロップイン互換はバグ互換の対象に境界があり、ファイル内容と encoding 宣言を
#   不整合にする挙動まで製品保証に含めるべきではない。非 UTF-8 ソースは検証コーパス全体で
#   8 件と稀だが、稀なファイルほど置換困難な資産である可能性がある。
# 本家へ upstream パッチを送るべき問題でもある。

# 意図的に本家と違えている箇所がもう 1 つある。**本家の `-A` は、構文的に正しいファイルを
# 構文エラーに変えることがある。** rails の guides/bug_report_templates/action_mailbox.rb で
# 実測した。
#
#   原本       : Syntax OK
#   本家 -A 後 : ruby: .../action_mailbox.rb:53: syntax error found (SyntaxError)
#   移植 -A 後 : Syntax OK
#
# 経路: `routing (/^replies@/i) => :replies` から Style/RedundantParentheses が内側の括弧を
# 外すと `routing /^replies@/i => :replies` になり、正規表現リテラルが曖昧になる。本家の
# Lint/AmbiguousRegexpLiteral は find_offense_node が正規表現の親 (ハッシュの pair) を選び、
# add_parentheses が `corrector.wrap` の枝を通って **pair だけ**を括弧で囲む。
# `routing (/^replies@/i => :replies)` という形は Ruby の構文として存在しない。
# 本家はそこで解析できなくなり、以降どの cop も動かない。sonicop は tree-sitter が
# 寛容に読むので先へ進み、`routing(/^replies@/i => :replies)` という正しい Ruby に着地する。
#
# **合わせない。** 合わせると sonicop が構文エラーを吐くようになる。一度実装して差し戻した
# 経緯があるので、再挑戦する前にここを読むこと (`ruby -c` で両者の出力を確かめれば 1 分で分かる)。
#
# 引数が 1 つなら両者とも `routing(/abc/)` で一致する。ハッシュ引数のときだけ割れる。

# 読めなかったファイルに本家が付ける文面のうち、1 つだけ再現していない。
#
#   本家   : "\x81" followed by " " on windows-31j.
#   sonicop: Invalid byte sequence in utf-8.
#
# 多バイト符号化で先導バイトは妥当・後続が不正、という失敗のときに出る。再現するには
# **Ruby の正準符号化名**が要るが、これは `encoding_rs` が答える名前と違う
# (宣言 `cp932` → 本家 `windows-31j` / `encoding_rs` は `Shift_JIS`、
#  宣言 `ascii` → 本家 `us-ascii` / `encoding_rs` に US-ASCII は無い)。
# 別名から正準名への表を新設することになり、**表に入れた分しか正しくならない**。
# 5 コーパスに該当ファイルは 0 件で、かつ**この差は以前からある** (直さないことで
# 悪くなるものが無い) ため、費用の割に合わないと判断した。
#
# **この一覧は実測の標本であって、網羅ではない。** 9 通り測って「2 形」と書き、
# 13 通りで「3 形」になり、16 通りで「4 形」になった。**5 形目が無い保証は無い。**
# 文面の出所は Ruby のパーサ側なので、網羅するならそこを読むことになる。
#
#   A  Invalid byte sequence in utf-8.        実効符号化が UTF-8 でバイトが不正   再現済み
#   B1 "\xNN" on <正準名>.                    単一バイトが表せない (us-ascii)     再現済み
#   B2 "\xNN" followed by "<文字>" on <正準名>. 多バイトの後続が不正              ★ 未再現
#   C  Unknown encoding name - <ラベル>.      ラベルが解決できない               再現済み

# 意図的に本家と違えている箇所が 3 つ目。**本家の corrector が構文として成り立たない字面を
# 出すことがある。** 安全網 (src/engine.rs の withhold_unparsable) が、原本が構文的に有効
# だったのに補正後に fatal な構文エラーが出るファイルの書き戻しを止める。
#
# 手書きケースで当たっているのは 2 件。どちらも `ruby -c` で確認済み。
#
#   Style/RedundantStructKeywordInit
#     本家    S5 = Struct.new(:a })                       syntax error
#     sonicop S5 = Struct.new(:a, { keyword_init: true })  原本のまま
#     波括弧を明示した書き方で、本家の置換範囲がペアの末尾で止まり `}` だけが残る
#
#   Style/ExplicitBlockArgument
#     本家    def a(&block)\n  ->(&block).call\nend       syntax error
#     sonicop def a\n  ->{ yield }.call\nend               原本のまま
#     `->(&block)` は Ruby の構文として存在しない
#
# **テストは削っていない。** tests/cops.rs は本家の字面を書いたうえで、
# 「それは構文エラーなので採らず原本を残す」を期待値にしている。誰かが本家に
# 合わせ直せば、そのテストが落ちる。
#
# **コーパスでも発火する。死守ラインが 3 ファイル割れるのはこれである** (2026-08-17 実測)。
#
#   mastodon_mastodon の -A       差分 3 ファイル
#     app/models/account_suggestions/friends_of_friends_source.rb
#     app/models/account_summary.rb
#     app/services/notify_service.rb
#
# **3 件とも安全網の発火で、3 件とも正しい捕捉である。**
#
#   原本                          ruby -c OK
#   安全網を切った移植版の出力      ruby -c NG   ← 補正が壊す
#   ★ 本家の -A 出力              ruby -c NG   ← 本家も同じように壊す
#
# つまり**本家は実在のコードを 3 ファイル壊し、移植版は原本を残す。**バイト列は割れるが、
# 割れている理由は移植版が正しいことである。`action_mailbox.rb` と同じ family で、
# あちらが 1 件の手作業の発見だったのに対し、こちらはコーパス全体で数えた値。
#
#   rubocop_rubocop   差分 1 (安全網とは無関係。本家が `'…' \` + `%{…}` をパースできない)
#   mastodon_mastodon 差分 3 (すべて安全網。上記)
#   Homebrew_brew     差分 0
#
# **この 3 件を「バイト一致」に戻す唯一の方法は、本家と同じように壊すことである。**
#
# ■ 安全網が捕まえられず、**本家も同じように壊す** 4 ケース (2026-08-17 実測)
#
# 移植版の出力が `ruby -c` を通らないが、**本家の出力とバイト単位で一致する。**
# 本家の欠陥を忠実に写しているので、直すと本家と割れる。**両側の `ruby -c` を書く** —
# 「移植版 NG」だけだと、後から読む人が移植版のバグだと読む。
#
#   cop                                     spec      原本   移植版  本家   出力
#   Style/MethodCallWithoutArgsParentheses  141       OK     NG      NG     バイト一致
#   Style/MethodCallWithoutArgsParentheses  156       OK     NG      NG     バイト一致
#   Style/RedundantSelf                     438       OK     NG      NG     バイト一致
#   Style/RedundantSelf                     453       OK     NG      NG     バイト一致
#
# 形はどれも `0.times { || it() }` / `0.times { |_n| self.it }`。**`it` が Ruby 3.4 の
# ブロック引数と衝突する。**本家の `parenthesized_it_method_in_block?` は
# 「`it` を括弧つきで保つべきか」を見るが、`||` という区切りがあると
# `empty_and_without_delimiters?` が偽になり、`if` が成立して `return false` する。
# **門が開いて括弧を外し、`it` が引数参照になって構文エラーになる。**
#
# 安全網はこれを止められない。**tree-sitter は `it` を普通のメソッド呼び出しとして
# 受理する**ので、補正後も木が通ってしまう (原則: 発火条件は「tree-sitter が拒む」で
# あって「Ruby が拒む」ではない)。
#
# **合わせない側に倒していない。本家と同じままにしている。**
#
# **この安全網は完全ではない。実測した (#41、spec 12,782 ケース / 分母 12,709)。**
#
#   安全網が止めた (壊れた出力が disk に届かなかった)   24 件 / 10 cop
#   見逃した (tree-sitter が通してしまう壊れ方)          9 件 /  6 cop
#   誤検知 (正しい補正を止めた)                          1 件 = 0.0079%
#
# **止めた側と漏れた側の比は 24 対 9。**「完全保証」ではなく「検出できる破壊は止める」。
#
# 見逃しの正体は、**Ruby のパーサが規則違反として `SyntaxError` を投げるが、tree-sitter の
# 文法はその規則を模していない**形。実測した 7 通り:
#
#   def a; X = 1; end                    動的定数代入
#   def a(x, x)                          引数名の重複
#   break / next                         囲むループが無い
#   x = "#{next}"                        補間の中
#   def a; redo; end
#   class C; def a; end; retry; end
#
# **以前ここに「`%{...}` の中に `}`」と書いていたが、それは誤りだった。**測ると
# tree-sitter も拒む (`x = %{a }b}` は両者 NG)。**推測で書いた機構が 1 つ残っていた。**
#
# 誤検知 1 件は `Style/Lambda` の `->(x; y)` (#49)。直せば 0 になる。
#
# 測定条件: `TargetRubyVersion` を `-c` で固定し、移植版・本家・`ruby -c` の 3 者が
# 版で割れる 4 通りに同じ答えを返すことを確認したうえで測っている。**`--force-default-config`
# は版を固定しない** (cwd から推定する) ので、固定しないと数字が条件で動く。
# ■ 行継続補正の既知差
# 行継続の下記 3 入力を 2026-10-23 に本家 1.89.0 で再測定し、補正後の構文エラーを確認した。
# NestedParenthesizedCalls は字下げを挟む 2 つの継続で、KeywordParametersOrder は引数を
# 並べ替えた後の閉じ括弧の前で、バックスラッシュを残す。
# final_pos の段階順序を繰り返す変更はせず、原本の LF/CRLF ペアを同じ継続として取り込む。
# 前 2 形は既存の main_script 検査で拒否する。カンマと継続が隣接する 3 形目は本家の通常入力と
# 同じ有効な並べ替えを行う。LF では既存の補正であり、CRLF も同じ補正へそろえる。
# 原本保持と有効補正の差を明示し、通常対照を含む本家一致 102/114 と意図的差分 12 条件を混同しない。

continuation_writeback_divergences:
  - id: two_indented
    cop: Style/NestedParenthesizedCalls
    target_ruby: "2.7"
    source: "puts(foo \\\n  \\\n  bar)\n"
    endings: [lf, crlf]
    modes: [safe, unsafe]
    upstream:
      exit: 1
      offenses: [{"cop_name": "Lint/Syntax", "message": "bare backslash only allowed before newline\n(Using Ruby 2.7 parser; configure using `TargetRubyVersion` parameter, under `AllCops`)", "severity": "fatal", "corrected": false, "correctable": false, "location": {"start_line": 1, "start_column": 10, "last_line": 1, "last_column": 10, "length": 1, "line": 1, "column": 10}}, {"cop_name": "Style/NestedParenthesizedCalls", "message": "Add parentheses to nested method call `foo \\\n  \\\n  bar`.", "severity": "convention", "corrected": true, "correctable": true, "location": {"start_line": 1, "start_column": 6, "last_line": 3, "last_column": 5, "length": 15, "line": 1, "column": 6}}]
      source: "puts(foo \\(bar))\n"
    initial:
      exit: 1
      offenses: [{"cop_name": "Style/NestedParenthesizedCalls", "message": "Add parentheses to nested method call `foo \\\n  \\\n  bar`.", "severity": "convention", "corrected": false, "correctable": true, "location": {"start_line": 1, "start_column": 6, "last_line": 3, "last_column": 5, "length": 15, "line": 1, "column": 6}}]
      source: "puts(foo \\\n  \\\n  bar)\n"
    sonicop:
      exit: 2
      offenses: [{"cop_name": "Style/NestedParenthesizedCalls", "message": "Add parentheses to nested method call `foo \\\n  \\\n  bar`.", "severity": "convention", "corrected": false, "correctable": true, "location": {"start_line": 1, "start_column": 6, "last_line": 3, "last_column": 5, "length": 15, "line": 1, "column": 6}}]
      source: "puts(foo \\\n  \\\n  bar)\n"
      stderr: "Autocorrection was not written to example.rb because it introduced a syntax error.\n"
    note: >-
      本家の実 CLI は有効な原本を補正し、残ったバックスラッシュで新しい構文エラーを作る。
      候補も同じ補正を作るため、既存の main_script 検査によるファイル単位の拒否を維持する。
      原本の LF/CRLF と未補正の初期診断を返し、stderr に理由を示して終了 2 になる。
  - id: keywords_continuation
    cop: Style/KeywordParametersOrder
    target_ruby: "2.7"
    source: "def foo(optional: 1, \\\n  required:)\nend\n"
    endings: [lf, crlf]
    modes: [safe, unsafe]
    upstream:
      exit: 1
      offenses: [{"cop_name": "Lint/Syntax", "message": "bare backslash only allowed before newline\n(Using Ruby 2.7 parser; configure using `TargetRubyVersion` parameter, under `AllCops`)", "severity": "fatal", "corrected": false, "correctable": false, "location": {"start_line": 1, "start_column": 33, "last_line": 1, "last_column": 33, "length": 1, "line": 1, "column": 33}}, {"cop_name": "Lint/Syntax", "message": "unexpected token tRPAREN\n(Using Ruby 2.7 parser; configure using `TargetRubyVersion` parameter, under `AllCops`)", "severity": "fatal", "corrected": false, "correctable": false, "location": {"start_line": 1, "start_column": 34, "last_line": 1, "last_column": 34, "length": 1, "line": 1, "column": 34}}, {"cop_name": "Style/KeywordParametersOrder", "message": "Place optional keyword parameters at the end of the parameters list.", "severity": "convention", "corrected": true, "correctable": true, "location": {"start_line": 1, "start_column": 9, "last_line": 1, "last_column": 19, "length": 11, "line": 1, "column": 9}}]
      source: "def foo(required:, optional: 1, \\)\nend\n"
    initial:
      exit: 1
      offenses: [{"cop_name": "Style/KeywordParametersOrder", "message": "Place optional keyword parameters at the end of the parameters list.", "severity": "convention", "corrected": false, "correctable": true, "location": {"start_line": 1, "start_column": 9, "last_line": 1, "last_column": 19, "length": 11, "line": 1, "column": 9}}]
      source: "def foo(optional: 1, \\\n  required:)\nend\n"
